steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access 1 --secret="dbt_service_account" --format="json" > /workspace1/dbt_service_account.json
    volumes:
      - name: 'shared-volume'
        path: '/workspace1'


  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
      - "scotia_project_dbt/"
#
  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: 'bash'
    dir: "scotia_project_dbt"

    args:
      - '-c'
      - |
        cp /workspace1/dbt_service_account.json .
        cat dbt_service_account.json
        ls
        chmod 777 dbt_service_account.json


        env
        dbt debug
    volumes:
      - name: 'shared-volume'
        path: '/workspace1'

timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"

options:
  logging: CLOUD_LOGGING_ONLY
