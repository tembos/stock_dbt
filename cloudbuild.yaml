steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
      - "scotia_project_dbt/"

  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: 'bash'
    dir: "scotia_project_dbt"
    env:
      - "GOOGLE_APPLICATION_CREDENTIALS=/workspace/scotia_project_dbt/dbt_service_account.json"
    args:
      - '-c'
      - |
        echo "$DBT_SERVICE_ACCOUNT" > /workspace/dbt_service_account.json
        export GOOGLE_APPLICATION_CREDENTIALS="/workspace/dbt_service_account.json"
        dbt debug


timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"


options:
  logging: CLOUD_LOGGING_ONLY
