steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access 1 --secret="dbt_service_account" --format="json" > /workspace1/dbt_service_account.json
    volumes:
      - name: 'shared-volume'
        path: '/workspace1'
#  - name: 'gcr.io/cloud-builders/gcloud'
#    args:
#      - 'auth'
#      - 'activate-service-account'
#      - 'dbt-service-account@bigquerysheets-404104.iam.gserviceaccount.com'
#      - '--key-file=/secret/dbt_service_account.json'

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
      - "scotia_project_dbt/"
#
  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: 'bash'
    dir: "scotia_project_dbt"
    env:
      - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace1/dbt_service_account.json'
    args:
      - '-c'
      - |
        cp /workspace1/dbt_service_account.json .
        ls
        cat /workspace1/dbt_service_account.json
        export GOOGLE_APPLICATION_CREDENTIALS="/workspace1/dbt_service_account.json"
        dbt debug
    volumes:
      - name: 'shared-volume'
        path: '/workspace1'

timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"

options:
  logging: CLOUD_LOGGING_ONLY
