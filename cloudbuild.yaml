steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
      - "scotia_project_dbt/"

  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: 'bash'
    dir: "scotia_project_dbt"
    env:
      - "GOOGLE_APPLICATION_CREDENTIALS=/scotia_project_dbt/dbt_service_account.json"
    args:
      - '-c'
      - |
        ls 
        cat /scotia_project_dbt/dbt_service_account.json

timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"

options:
  logging: CLOUD_LOGGING_ONLY
