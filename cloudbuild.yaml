steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
      - "scotia_project_dbt/"

  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "$DBT_SERVICE_ACCOUNT" > /workspace/dbt_service_account.json
        export GOOGLE_APPLICATION_CREDENTIALS="/workspace/dbt_service_account.json"
        cd /workspace/scotia_project_dbt  # Ensure you're in the project directory
        ls -la  # Debugging step: check if files are present
        dbt debug --profiles-dir .

timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"

options:
  logging: CLOUD_LOGGING_ONLY
