steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access 1 --secret="dbt_service_account" --format="json" > /workspace1/dbt_service_account.json
    volumes:
      - name: 'shared-volume'
        path: '/workspace1'

#  - name: "gcr.io/cloud-builders/docker"
#    args:
#      - "build"
#      - "-t"
#      - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
#      - "scotia_project_dbt/"
#
  - name: "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"
    entrypoint: 'bash'
    dir: "scotia_project_dbt"

    args:
      - '-c'
      - |
        cp /workspace1/dbt_service_account.json .
        dbt seed --select source_nvda && dbt run --select source_nvda &&  dbt run --select stg_nvda && dbt show --select stg_nvda && dbt run --select ohlc_nvda && dbt show --select ohlc_nvda  && dbt test --select dwh_vs_expected --store-failures

    volumes:
      - name: 'shared-volume'
        path: '/workspace1'

timeout: 1200s

images:
  - "gcr.io/bigquerysheets-404104/dbt-bigquery:latest"

options:
  logging: CLOUD_LOGGING_ONLY
